[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = [
    "B008",  # FastAPI dependencies are function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # sys.path setup before local imports
"tests/*" = ["E402"]
"scripts/make_samples.py" = ["E501"]  # holds sample document prose

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
